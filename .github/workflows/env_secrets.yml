name: Demo CI ENV Secrets

on:
  push
#   workflow_dispatch
    
  
jobs:  
  build:
    runs-on: ubuntu-latest

    steps:
      
      - name: Run a one-line script
        run: echo Hello, world!
    
      - name: Install
        env:
            APP_ENV: dev
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Installing dependencies for environment $APP_ENV using $DB_PASSWORD"