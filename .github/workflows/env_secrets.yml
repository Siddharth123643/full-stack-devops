name: Demo CI ENV Secrets

on:
  push
#   workflow_dispatch
    
  
jobs:  
  build:
    runs-on: ubuntu-latest

    steps:
      
      - name: Run a one-line script
        run: echo Hello, world!
    
      - name: Install
        env:
            APP_ENV: dev
            DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Installing dependencies for environment $APP_ENV using $DB_PASSWORD"
      
      - name: Create demo file
        run: |
            echo "Hello from CI pipeline" > demo.txt
            echo "File created Successfully"

      - name: Upload Demo
        uses: actions/upload-artifact@v4
        with:
            name: build-artifacts-demo
            path: .
